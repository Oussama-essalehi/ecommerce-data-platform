name: ecommerce-data-platform

# Settings shared by the three containers that run the source simulator.
x-simulator: &simulator
  build: ./sources
  image: ecommerce-data-platform/shop-sim:local
  environment: &simulator-env
    SIM_SEED: ${SIM_SEED:-42}
    SIM_START_DATE: ${SIM_START_DATE:-2025-10-01}
    SIM_ORDERS_PER_DAY: ${SIM_ORDERS_PER_DAY:-600}
    SIM_DEFECT_RATE: ${SIM_DEFECT_RATE:-1.0}
    SIM_API_ERROR_RATE: ${SIM_API_ERROR_RATE:-0.02}
    SIM_LANDING_DIR: /data/landing/marketplace
    SIM_STATE_DIR: /state
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_TOPIC: shop.orders.v1
  volumes:
    - ./data/landing:/data/landing
    - producer-state:/state

# How containers reach the PostgreSQL warehouse (inside the Docker network).
x-warehouse-env: &warehouse-env
  WAREHOUSE_HOST: warehouse
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_DB: warehouse
  WAREHOUSE_USER: warehouse
  WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}

# Settings shared by the containers that run the Spark jobs.
x-pipelines: &pipelines
  build: ./pipelines
  image: ecommerce-data-platform/pipelines:local
  environment:
    LAKE_ROOT: /data/lake
    LANDING_ROOT: /data/landing
    SHOP_API_URL: http://shop-api:8000
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    KAFKA_TOPIC: shop.orders.v1
    SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
    <<: *warehouse-env
  volumes:
    - ./data/landing:/data/landing
    - ./data/lake:/data/lake

services:
  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Two listeners: kafka:19092 for containers, localhost:9092 for your machine.
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Creates the topic once, then exits. Retention is unlimited so the
  # replayed history is not deleted after Kafka's default seven days.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092
        --create --if-not-exists --topic shop.orders.v1
        --partitions 3 --replication-factor 1
        --config retention.ms=-1

  # Web console to browse topics and messages: http://localhost:8085
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # Source 1: REST API serving customers and products. http://localhost:8000/docs
  shop-api:
    <<: *simulator
    command: ["api"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Source 2: web shop order events. Replays the history on first start, then follows live.
  order-producer:
    <<: *simulator
    command: ["produce"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-off commands, e.g. source 3, the marketplace CSV exports:
  #   docker compose run --rm simulator export-csv
  simulator:
    <<: *simulator
    profiles: ["cli"]

  # Kafka -> bronze.order_events, as a long-running Spark Structured Streaming
  # query. Spark UI while it runs: http://localhost:4040
  bronze-events:
    <<: *pipelines
    command: ["bronze-events", "--continuous"]
    ports:
      - "4040:4040"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-off Spark jobs, e.g.:
  #   docker compose run --rm spark bronze-api
  #   docker compose run --rm spark bronze-marketplace --all
  #   docker compose run --rm spark status
  spark:
    <<: *pipelines
    profiles: ["cli"]
    depends_on:
      shop-api:
        condition: service_healthy
      warehouse:
        condition: service_healthy

  # The data warehouse. From your machine: localhost:5432, database
  # "warehouse", user "warehouse" (password "warehouse" unless changed in .env).
  #   docker compose exec warehouse psql -U warehouse -d warehouse
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
    ports:
      - "${WAREHOUSE_HOST_PORT:-5432}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # dbt, which builds the star schema inside the warehouse:
  #   docker compose run --rm dbt build
  dbt:
    build: ./warehouse
    image: ecommerce-data-platform/dbt:local
    profiles: ["cli"]
    environment:
      <<: *warehouse-env
    volumes:
      - ./warehouse:/usr/app
    depends_on:
      warehouse:
        condition: service_healthy

volumes:
  kafka-data:
  producer-state:
  warehouse-data:
