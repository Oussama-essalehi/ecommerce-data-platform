name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sources/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r sources/requirements-dev.txt
      - name: Run the simulator tests
        working-directory: sources
        run: python -m pytest -q

  pipelines:
    runs-on: ubuntu-latest
    # A real PostgreSQL for the tests of the warehouse load.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/constraints.txt
      - name: Install dependencies
        run: pip install -r pipelines/requirements-dev.txt -c pipelines/constraints.txt
      - name: Run the Spark job tests (downloads the Delta Lake jars)
        working-directory: pipelines
        run: python -m pytest -q

  warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouse -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGPASSWORD: warehouse
      DBT_PROFILES_DIR: .
    defaults:
      run:
        working-directory: warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: warehouse/requirements.txt
      - name: Install dbt
        run: pip install -r requirements.txt
      - name: Load the sample of the lake tables
        run: psql -h localhost -U warehouse -d warehouse -v ON_ERROR_STOP=1 -q -f ci/sample_lake.sql
      - name: Build and test the dbt project
        run: dbt build
