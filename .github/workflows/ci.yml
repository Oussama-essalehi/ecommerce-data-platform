name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sources/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r sources/requirements-dev.txt
      - name: Run the simulator tests
        working-directory: sources
        run: python -m pytest -q

  pipelines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipelines/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r pipelines/requirements-dev.txt
      - name: Run the Spark job tests (downloads the Delta Lake jars)
        working-directory: pipelines
        run: python -m pytest -q
